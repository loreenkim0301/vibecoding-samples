<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브코딩 실습 완성본</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f4f6fb; color: #1c2430; line-height: 1.6; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 18px 56px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .sub { margin: 0 0 26px; color: #667085; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  a.card { display: block; padding: 22px; background: #fff; border: 1px solid #e3e7ef; border-radius: 16px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: #2457f5; }
  .tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #2457f5; }
  a.card h2 { margin: 6px 0 6px; font-size: 20px; }
  a.card p { margin: 0; color: #667085; font-size: 15px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>ChatGPT 바이브코딩 실습 완성본</h1>
  <p class="sub">수업 프롬프트(1차 생성 + 수정 요청)를 모두 반영했을 때의 결과 예시입니다.</p>
  <div class="grid">
    <a class="card" href="dashboard/"><span class="tag">실습 A</span><h2>매출 대시보드</h2><p>요약 카드 · 월별 매출 그래프 · 상품 표 검색과 카테고리 필터</p></a>
    <a class="card" href="calculator/"><span class="tag">실습 B</span><h2>상품 가격 계산기</h2><p>정해 둔 계산식 · 자동 계산 · 초기화 버튼</p></a>
    <a class="card" href="todo/"><span class="tag">실습 C</span><h2>TODO 체크리스트</h2><p>추가·수정·삭제(CRUD) · 상태 구분 · 새로고침해도 유지(localStorage)</p></a>
    <a class="card" href="homepage/"><span class="tag">2.3 홈페이지</span><h2>LocalLink 회사 홈페이지</h2><p>메뉴 전환 · 회사 소개 · 시연용 문의하기 폼</p></a>
  </div>
</div>
</body>
</html>
